server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the React single-page app; unknown routes fall back to index.html
    # so client-side routing (React Router) works on refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward all API calls to the backend container on the internal network.
    # The backend mounts its routes under /api/v1/hms, so the path is preserved.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
